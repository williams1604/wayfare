<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Holiday Packages - Wayfare Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700&amp;display=swap"
    rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-[#FAFBFC] text-[#2D3142]">
  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-[1280px] mx-auto px-6">
      <nav class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-2">
          <svg class="w-10 h-10 text-[#FF6B35]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"></path>
          </svg>
          <span class="text-2xl font-bold text-[#2D3142]">Wayfare</span>
        </a>
        <ul class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <li><a class="text-[#2D3142] hover:text-[#FF6B35] transition-colors" href="index.html">Home</a></li>
          <li><a class="text-[#2D3142] hover:text-[#FF6B35] transition-colors" href="destinations.html">Destinations</a></li>
          <li><a class="text-[#FF6B35] font-semibold" href="packages.html">Packages</a></li>
          <li><a class="text-[#2D3142] hover:text-[#FF6B35] transition-colors" href="about.html">About</a></li>
          <li><a class="text-[#2D3142] hover:text-[#FF6B35] transition-colors" href="contact.html">Contact</a></li>
        </ul>
        <div id="nav-user-area" class="flex items-center space-x-4"></div>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-[#004E89] py-16 text-white text-center">
    <div class="max-w-[1280px] mx-auto px-6" data-aos="zoom-in">
      <h1 class="text-4xl font-bold mb-2">Curated Holiday Packages</h1>
      <p class="text-lg opacity-85 max-w-xl mx-auto">Explore all-inclusive travel plans designed for lifetime memories.</p>
    </div>
  </section>

  <!-- Main Content Layout -->
  <main class="py-16 max-w-[1280px] mx-auto px-6">
    <div class="grid lg:grid-cols-4 gap-8">
      
      <!-- Filters Sidebar -->
      <aside class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit" data-aos="fade-right">
        <h3 class="font-bold text-lg text-[#2D3142] mb-6 pb-3 border-b border-gray-100">Filter Packages</h3>
        
        <!-- Search -->
        <div class="mb-6">
          <label class="block text-xs font-semibold text-gray-500 mb-2">Search Keyword</label>
          <input type="text" id="pkgQuery" oninput="applyFilters()" placeholder="e.g. Alps, Kyoto, Dubai..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#FF6B35]" />
        </div>

        <!-- Price Range -->
        <div class="mb-6">
          <label class="block text-xs font-semibold text-gray-500 mb-2">Price Filter</label>
          <div class="space-y-2 text-sm text-gray-700">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="priceRange" value="all" checked onchange="applyFilters()" class="accent-[#FF6B35]" /> All Prices
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="priceRange" value="under1" onchange="applyFilters()" class="accent-[#FF6B35]" /> Under ₹1 Lakh
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="priceRange" value="1to2" onchange="applyFilters()" class="accent-[#FF6B35]" /> ₹1 Lakh - ₹2 Lakhs
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="priceRange" value="over2" onchange="applyFilters()" class="accent-[#FF6B35]" /> Over ₹2 Lakhs
            </label>
          </div>
        </div>

        <!-- Sort By -->
        <div class="mb-6">
          <label class="block text-xs font-semibold text-gray-500 mb-2">Sort Results</label>
          <select id="pkgSort" onchange="applyFilters()" class="w-full px-3 py-2 border rounded-lg text-sm text-gray-700 focus:outline-none">
            <option value="popular">Most Popular</option>
            <option value="priceLow">Price: Low to High</option>
            <option value="priceHigh">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>
      </aside>

      <!-- Packages Grid -->
      <section class="lg:col-span-3">
        <div id="pkgContainer" class="grid md:grid-cols-2 gap-8" data-aos="fade-up">
          <!-- Rendered dynamically -->
        </div>
      </section>

    </div>
  </main>

  <!-- Booking Modal -->
  <div id="bookingModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeBookingModal()"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden p-6 z-10">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-[#2D3142]">Book <span id="modalPkgTitle" class="text-[#FF6B35]"></span></h3>
        <button onclick="closeBookingModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-4">
        <input type="hidden" id="modalPkgId" />
        <input type="hidden" id="modalPkgName" />
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">First Name</label>
            <input type="text" id="bkgFirstName" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="John" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Last Name</label>
            <input type="text" id="bkgLastName" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Doe" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
            <input type="email" id="bkgEmail" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="john@example.com" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Phone</label>
            <input type="tel" id="bkgPhone" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="+1 (555) 123-4567" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Travel Date</label>
            <input type="date" id="bkgDate" required class="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Travelers</label>
            <input type="number" id="bkgTravelers" min="1" max="20" value="2" required class="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Special Requests</label>
          <textarea id="bkgRequests" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Meal preferences, room requests..."></textarea>
        </div>
        <button type="submit" class="w-full bg-[#FF6B35] text-white font-bold py-3.5 rounded-xl hover:bg-[#e55a2b] transition-colors shadow-lg">
          Proceed to Payment &rarr;
        </button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-[#2D3142] text-white py-12">
    <div class="max-w-[1280px] mx-auto px-6 text-center text-sm text-gray-400">
      <p>&copy; 2026 Wayfare. All rights reserved.</p>
    </div>
  </footer>

  <script src="static/js/app-state.js"></script>
  <script src="static/js/chatbot.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true });

    function applyFilters() {
      const q = document.getElementById('pkgQuery').value.toLowerCase();
      const priceVal = document.querySelector('input[name="priceRange"]:checked').value;
      const sortVal = document.getElementById('pkgSort').value;

      let list = WayfareState.getPackages();

      // Search filter
      if (q) {
        list = list.filter(p => p.name.toLowerCase().includes(q) || p.destination.toLowerCase().includes(q) || p.description.toLowerCase().includes(q));
      }

      // Price filter
      if (priceVal === 'under1') list = list.filter(p => p.price < 100000);
      else if (priceVal === '1to2') list = list.filter(p => p.price >= 100000 && p.price <= 200000);
      else if (priceVal === 'over2') list = list.filter(p => p.price > 200000);

      // Sort
      if (sortVal === 'priceLow') list.sort((a, b) => a.price - b.price);
      else if (sortVal === 'priceHigh') list.sort((a, b) => b.price - a.price);
      else if (sortVal === 'rating') list.sort((a, b) => b.rating - a.rating);

      renderPackages(list);
    }

    function renderPackages(list) {
      const container = document.getElementById('pkgContainer');
      if (!list.length) {
        container.innerHTML = `<div class="col-span-2 text-center py-16 bg-white rounded-2xl shadow-sm text-gray-400">No packages matching criteria.</div>`;
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="bg-white rounded-2xl overflow-hidden shadow-md border border-gray-100 hover:shadow-xl transition-all flex flex-col justify-between">
          <div>
            <div class="relative h-60">
              <img src="${p.image_url}" alt="${p.name}" class="w-full h-full object-cover" />
              <span class="absolute top-4 right-4 bg-[#FF6B35] text-white text-sm font-bold px-3.5 py-1 rounded-full shadow-md">
                ₹${Number(p.price).toLocaleString('en-IN')}
              </span>
            </div>
            <div class="p-6">
              <div class="flex items-center gap-1 text-yellow-500 text-xs font-semibold mb-2">
                ★ ${p.rating} (${p.reviews_count || 45} reviews)
              </div>
              <h3 class="text-xl font-bold text-[#2D3142] mb-2">${p.name}</h3>
              <p class="text-xs text-gray-500 mb-4 line-clamp-3 leading-relaxed">${p.description}</p>
            </div>
          </div>
          <div class="p-6 pt-0 flex items-center justify-between border-t border-gray-100 mt-4">
            <span class="text-xs text-gray-400 font-medium">${p.duration}</span>
            <button onclick="openBookingModal(${p.id}, '${p.name.replace(/'/g, "\\'")}')" class="px-6 py-2.5 bg-[#FF6B35] text-white text-xs font-bold rounded-xl hover:bg-[#e55a2b] transition-colors shadow-md">
              Book Package
            </button>
          </div>
        </div>
      `).join('');
    }

    function openBookingModal(pkgId, pkgName) {
      document.getElementById('modalPkgId').value = pkgId;
      document.getElementById('modalPkgName').value = pkgName;
      document.getElementById('modalPkgTitle').textContent = pkgName;

      const user = WayfareState.getCurrentUser();
      if (user) {
        document.getElementById('bkgEmail').value = user.email || '';
        document.getElementById('bkgFirstName').value = user.name.split(' ')[0] || '';
        document.getElementById('bkgLastName').value = user.name.split(' ')[1] || '';
      }

      document.getElementById('bookingModal').classList.remove('hidden');
    }

    function closeBookingModal() {
      document.getElementById('bookingModal').classList.add('hidden');
    }

    function submitBooking(e) {
      e.preventDefault();
      const pkgId = document.getElementById('modalPkgId').value;
      const pkgName = document.getElementById('modalPkgName').value;
      const firstName = document.getElementById('bkgFirstName').value;
      const lastName = document.getElementById('bkgLastName').value;
      const email = document.getElementById('bkgEmail').value;
      const phone = document.getElementById('bkgPhone').value;
      const date = document.getElementById('bkgDate').value;
      const travelers = parseInt(document.getElementById('bkgTravelers').value) || 1;
      const requests = document.getElementById('bkgRequests').value;

      let user = WayfareState.getCurrentUser();
      if (!user) {
        user = { name: `${firstName} ${lastName}`, email: email, role: 'user' };
        WayfareState.setCurrentUser(user);
      }

      const booking = WayfareState.addBooking({
        user_email: email,
        first_name: firstName,
        last_name: lastName,
        phone: phone,
        destination: pkgName,
        package_id: pkgId,
        date: date,
        travelers: travelers,
        special_requests: requests,
        status: 'Pending',
        total_amount: 150000 * travelers
      });

      closeBookingModal();
      window.location.href = `payment.html?id=${booking.id}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const destParam = params.get('dest');
      if (destParam) {
        document.getElementById('pkgQuery').value = destParam;
      }
      applyFilters();
    });
  </script>
</body>

</html>
