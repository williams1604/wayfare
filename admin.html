<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Wayfare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-gray-100 text-gray-800">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md flex-shrink-0 flex flex-col">
      <div class="p-6 border-b border-gray-100">
        <div class="flex items-center gap-2 text-[#FF6B35]">
          <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"></path>
          </svg>
          <span class="text-xl font-bold">Wayfare Admin</span>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
        <button onclick="switchAdminTab('dashboard')" id="navDash" class="w-full text-left flex items-center gap-3 px-4 py-3 text-[#FF6B35] bg-orange-50 rounded-lg font-medium">Dashboard</button>
        <button onclick="switchAdminTab('bookings')" id="navBookings" class="w-full text-left flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">Bookings</button>
        <button onclick="switchAdminTab('reviews')" id="navReviews" class="w-full text-left flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">Reviews</button>
        <button onclick="switchAdminTab('packages')" id="navPackages" class="w-full text-left flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">Add Package</button>
        <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium mt-auto">Back to Site</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8">
      <header class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-gray-800" id="adminTabTitle">Dashboard Overview</h1>
        <div class="text-sm font-medium text-gray-900">Administrator</div>
      </header>

      <!-- Dashboard Tab -->
      <div id="sectionDash" class="space-y-8">
        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h3 class="text-gray-500 text-sm font-medium mb-2">Total Bookings</h3>
            <div class="text-3xl font-bold text-gray-900" id="statBookingsCount">0</div>
          </div>
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h3 class="text-gray-500 text-sm font-medium mb-2">Total Packages</h3>
            <div class="text-3xl font-bold text-gray-900" id="statPackagesCount">0</div>
          </div>
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h3 class="text-gray-500 text-sm font-medium mb-2">Pending Reviews</h3>
            <div class="text-3xl font-bold text-gray-900" id="statReviewsCount">0</div>
          </div>
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h3 class="text-gray-500 text-sm font-medium mb-2">Total Enquiries</h3>
            <div class="text-3xl font-bold text-gray-900" id="statEnquiriesCount">0</div>
          </div>
        </div>

        <!-- Recent Bookings -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="px-6 py-4 border-b border-gray-100 font-semibold text-lg">Recent Bookings</div>
          <div id="adminBookingsTable"></div>
        </div>

        <!-- Recent Enquiries -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="px-6 py-4 border-b border-gray-100 font-semibold text-lg">Customer Enquiries</div>
          <div id="adminEnquiriesTable"></div>
        </div>
      </div>

      <!-- Bookings Tab -->
      <div id="sectionBookings" class="hidden space-y-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div id="adminFullBookingsTable"></div>
        </div>
      </div>

      <!-- Reviews Tab -->
      <div id="sectionReviews" class="hidden space-y-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div id="adminReviewsTable"></div>
        </div>
      </div>

      <!-- Add Package Tab -->
      <div id="sectionPackages" class="hidden">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 max-w-2xl">
          <form onsubmit="saveNewPackage(event)" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Package Name</label>
                <input type="text" id="pkgAddName" required class="w-full px-4 py-2 border rounded-lg" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Price (₹)</label>
                <input type="number" id="pkgAddPrice" required class="w-full px-4 py-2 border rounded-lg" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Duration</label>
                <input type="text" id="pkgAddDuration" placeholder="7 Days / 6 Nights" required class="w-full px-4 py-2 border rounded-lg" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Destination</label>
                <input type="text" id="pkgAddDest" placeholder="Switzerland" required class="w-full px-4 py-2 border rounded-lg" />
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
              <input type="url" id="pkgAddImg" required class="w-full px-4 py-2 border rounded-lg" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
              <textarea id="pkgAddDesc" rows="3" required class="w-full px-4 py-2 border rounded-lg"></textarea>
            </div>
            <button type="submit" class="px-6 py-3 bg-[#FF6B35] text-white font-bold rounded-lg hover:bg-[#e55a2b]">
              Add Package
            </button>
          </form>
        </div>
      </div>

    </main>
  </div>

  <script src="static/js/app-state.js"></script>
  <script>
    function renderAdmin() {
      const bookings = WayfareState.getBookings();
      const packages = WayfareState.getPackages();
      const reviews = WayfareState.getReviews();
      const enquiries = WayfareState.getEnquiries();

      document.getElementById('statBookingsCount').textContent = bookings.length;
      document.getElementById('statPackagesCount').textContent = packages.length;
      document.getElementById('statReviewsCount').textContent = reviews.filter(r => !r.is_approved).length;
      document.getElementById('statEnquiriesCount').textContent = enquiries.length;

      // Bookings Table
      const bookingsHTML = `
        <table class="w-full text-left">
          <thead class="bg-gray-50 border-b text-xs font-semibold text-gray-500 uppercase">
            <tr>
              <th class="px-6 py-4">Customer</th>
              <th class="px-6 py-4">Destination</th>
              <th class="px-6 py-4">Date</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y text-sm">
            ${bookings.map(b => `
              <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 font-medium">${b.first_name ? b.first_name + ' ' + b.last_name : b.user_email}</td>
                <td class="px-6 py-4">${b.destination}</td>
                <td class="px-6 py-4">${b.date}</td>
                <td class="px-6 py-4">
                  <select onchange="changeStatus(${b.id}, this.value)" class="border rounded px-2 py-1 text-xs">
                    <option value="Confirmed" ${b.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                    <option value="Validation Pending" ${b.status === 'Validation Pending' ? 'selected' : ''}>Validation Pending</option>
                    <option value="Pending" ${b.status === 'Pending' ? 'selected' : ''}>Pending</option>
                    <option value="Cancelled" ${b.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                  </select>
                </td>
                <td class="px-6 py-4">
                  <button onclick="deleteBkg(${b.id})" class="text-red-600 font-semibold hover:underline">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      document.getElementById('adminBookingsTable').innerHTML = bookingsHTML;
      document.getElementById('adminFullBookingsTable').innerHTML = bookingsHTML;

      // Enquiries Table
      document.getElementById('adminEnquiriesTable').innerHTML = `
        <table class="w-full text-left">
          <thead class="bg-gray-50 border-b text-xs font-semibold text-gray-500 uppercase">
            <tr>
              <th class="px-6 py-4">Name / Email</th>
              <th class="px-6 py-4">Subject</th>
              <th class="px-6 py-4">Message</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Action</th>
            </tr>
          </thead>
          <tbody class="divide-y text-sm">
            ${enquiries.map(e => `
              <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 font-medium">${e.name}<br><span class="text-xs text-gray-400">${e.email}</span></td>
                <td class="px-6 py-4">${e.subject}</td>
                <td class="px-6 py-4 max-w-xs text-gray-600">${e.message}</td>
                <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs rounded-full ${e.status === 'Responded' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${e.status}</span></td>
                <td class="px-6 py-4">
                  ${e.status !== 'Responded' ? `<button onclick="replyEnquiry(${e.id})" class="text-[#FF6B35] font-semibold hover:underline">Respond</button>` : '<span class="text-gray-400">Responded</span>'}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      // Reviews Table
      document.getElementById('adminReviewsTable').innerHTML = `
        <table class="w-full text-left">
          <thead class="bg-gray-50 border-b text-xs font-semibold text-gray-500 uppercase">
            <tr>
              <th class="px-6 py-4">User</th>
              <th class="px-6 py-4">Package</th>
              <th class="px-6 py-4">Rating</th>
              <th class="px-6 py-4">Comment</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y text-sm">
            ${reviews.map(r => `
              <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 font-medium">${r.user_name}</td>
                <td class="px-6 py-4">${r.package_name}</td>
                <td class="px-6 py-4 text-yellow-500 font-bold">★ ${r.rating}</td>
                <td class="px-6 py-4 max-w-xs text-gray-600">${r.comment}</td>
                <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs rounded-full ${r.is_approved ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${r.is_approved ? 'Approved' : 'Pending'}</span></td>
                <td class="px-6 py-4 flex gap-3">
                  <button onclick="toggleRev(${r.id})" class="font-semibold text-blue-600 hover:underline">${r.is_approved ? 'Hide' : 'Approve'}</button>
                  <button onclick="delRev(${r.id})" class="font-semibold text-red-600 hover:underline">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function switchAdminTab(tab) {
      document.querySelectorAll('#sectionDash, #sectionBookings, #sectionReviews, #sectionPackages').forEach(sec => sec.classList.add('hidden'));
      document.querySelectorAll('#navDash, #navBookings, #navReviews, #navPackages').forEach(btn => btn.className = 'w-full text-left flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium');

      if (tab === 'dashboard') {
        document.getElementById('sectionDash').classList.remove('hidden');
        document.getElementById('navDash').className = 'w-full text-left flex items-center gap-3 px-4 py-3 text-[#FF6B35] bg-orange-50 rounded-lg font-medium';
        document.getElementById('adminTabTitle').textContent = 'Dashboard Overview';
      } else if (tab === 'bookings') {
        document.getElementById('sectionBookings').classList.remove('hidden');
        document.getElementById('navBookings').className = 'w-full text-left flex items-center gap-3 px-4 py-3 text-[#FF6B35] bg-orange-50 rounded-lg font-medium';
        document.getElementById('adminTabTitle').textContent = 'All Customer Bookings';
      } else if (tab === 'reviews') {
        document.getElementById('sectionReviews').classList.remove('hidden');
        document.getElementById('navReviews').className = 'w-full text-left flex items-center gap-3 px-4 py-3 text-[#FF6B35] bg-orange-50 rounded-lg font-medium';
        document.getElementById('adminTabTitle').textContent = 'Customer Reviews Moderation';
      } else if (tab === 'packages') {
        document.getElementById('sectionPackages').classList.remove('hidden');
        document.getElementById('navPackages').className = 'w-full text-left flex items-center gap-3 px-4 py-3 text-[#FF6B35] bg-orange-50 rounded-lg font-medium';
        document.getElementById('adminTabTitle').textContent = 'Add New Travel Package';
      }
    }

    function changeStatus(id, val) {
      WayfareState.updateBookingStatus(id, val);
      renderAdmin();
    }

    function deleteBkg(id) {
      if (confirm('Delete booking #' + id + '?')) {
        WayfareState.deleteBooking(id);
        renderAdmin();
      }
    }

    function replyEnquiry(id) {
      const resp = prompt('Enter response to customer enquiry:');
      if (resp) {
        WayfareState.respondEnquiry(id, resp);
        renderAdmin();
      }
    }

    function toggleRev(id) {
      WayfareState.toggleReviewApproval(id);
      renderAdmin();
    }

    function delRev(id) {
      if (confirm('Delete review?')) {
        WayfareState.deleteReview(id);
        renderAdmin();
      }
    }

    function saveNewPackage(e) {
      e.preventDefault();
      WayfareState.addPackage({
        name: document.getElementById('pkgAddName').value,
        price: parseFloat(document.getElementById('pkgAddPrice').value),
        duration: document.getElementById('pkgAddDuration').value,
        destination: document.getElementById('pkgAddDest').value,
        image_url: document.getElementById('pkgAddImg').value,
        description: document.getElementById('pkgAddDesc').value,
        rating: 5.0,
        reviews_count: 1
      });

      alert('Package added successfully!');
      switchAdminTab('dashboard');
      renderAdmin();
    }

    document.addEventListener('DOMContentLoaded', renderAdmin);
  </script>
</body>

</html>
