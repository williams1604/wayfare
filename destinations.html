<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Destinations - Wayfare Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@600;700&amp;display=swap"
    rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-[#FAFBFC] text-[#2D3142]">
  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-[1280px] mx-auto px-6">
      <nav class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-2">
          <svg class="w-10 h-10 text-[#FF6B35]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"></path>
          </svg>
          <span class="text-2xl font-bold text-[#2D3142]">Wayfare</span>
        </a>
        <ul class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <li><a class="text-[#2D3142] hover:text-[#FF6B35] transition-colors" href="index.html">Home</a></li>
          <li><a class="text-[#FF6B35] font-semibold" href="destinations.html">Destinations</a></li>
          <li><a class="text-[#2D3142] hover:text-[#FF6B35] transition-colors" href="packages.html">Packages</a></li>
          <li><a class="text-[#2D3142] hover:text-[#FF6B35] transition-colors" href="about.html">About</a></li>
          <li><a class="text-[#2D3142] hover:text-[#FF6B35] transition-colors" href="contact.html">Contact</a></li>
        </ul>
        <div id="nav-user-area" class="flex items-center space-x-4"></div>
      </nav>
    </div>
  </header>

  <!-- Banner -->
  <section class="bg-[#004E89] py-20 text-white text-center">
    <div class="max-w-[1280px] mx-auto px-6" data-aos="zoom-in">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Explore Destinations</h1>
      <p class="text-lg opacity-90 max-w-xl mx-auto">Find handpicked wonderlands and iconic cities across the globe.</p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="py-16 max-w-[1280px] mx-auto px-6">
    <!-- Filter bar -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-12" data-aos="fade-up">
      <div class="relative w-full md:w-80">
        <input type="text" id="destSearch" oninput="filterDestinations()" placeholder="Search destinations..." class="w-full px-4 py-3 pl-10 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#FF6B35]" />
        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <div class="flex flex-wrap gap-2">
        <button onclick="setCategory('all')" class="cat-btn px-4 py-2 bg-[#FF6B35] text-white rounded-lg text-xs font-semibold">All Regions</button>
        <button onclick="setCategory('Europe')" class="cat-btn px-4 py-2 bg-white text-gray-600 border rounded-lg text-xs font-semibold hover:border-[#FF6B35]">Europe</button>
        <button onclick="setCategory('Asia')" class="cat-btn px-4 py-2 bg-white text-gray-600 border rounded-lg text-xs font-semibold hover:border-[#FF6B35]">Asia</button>
        <button onclick="setCategory('Middle East')" class="cat-btn px-4 py-2 bg-white text-gray-600 border rounded-lg text-xs font-semibold hover:border-[#FF6B35]">Middle East</button>
      </div>
    </div>

    <!-- Grid -->
    <div id="destGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" data-aos="fade-up">
      <!-- Generated dynamically -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#2D3142] text-white py-12">
    <div class="max-w-[1280px] mx-auto px-6 text-center text-sm text-gray-400">
      <p>&copy; 2026 Wayfare. All rights reserved.</p>
    </div>
  </footer>

  <script src="static/js/app-state.js"></script>
  <script src="static/js/chatbot.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true });

    const destinationsList = [
      { name: "Switzerland", region: "Europe", img: "https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?w=600&h=400&fit=crop", packages: 7, desc: "Alpine wonderland with glacier rides and serene mountain chalets." },
      { name: "Japan", region: "Asia", img: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&h=400&fit=crop", packages: 5, desc: "Cherry blossoms, ancient temples, high-tech cities &amp; hot springs." },
      { name: "Italy", region: "Europe", img: "https://images.unsplash.com/photo-1533105079780-92b9be482077?w=600&h=400&fit=crop", packages: 6, desc: "Amalfi Coast, Rome ruins, Venetian canals &amp; Tuscan vineyards." },
      { name: "Greece", region: "Europe", img: "https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?w=600&h=400&fit=crop", packages: 4, desc: "Santorini sunsets, Aegean boat cruises &amp; ancient Greek architecture." },
      { name: "Bali", region: "Asia", img: "https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=600&h=400&fit=crop", packages: 5, desc: "Tropical beaches, Ubud rice terraces, and island spa retreats." },
      { name: "Dubai", region: "Middle East", img: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=600&h=400&fit=crop", packages: 6, desc: "Desert safaris, luxury shopping, and iconic skyscrapers." }
    ];

    let currentCategory = 'all';

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.textContent.toLowerCase().includes(cat.toLowerCase()) || (cat === 'all' && btn.textContent.includes('All'))) {
          btn.className = 'cat-btn px-4 py-2 bg-[#FF6B35] text-white rounded-lg text-xs font-semibold';
        } else {
          btn.className = 'cat-btn px-4 py-2 bg-white text-gray-600 border rounded-lg text-xs font-semibold hover:border-[#FF6B35]';
        }
      });
      filterDestinations();
    }

    function filterDestinations() {
      const q = document.getElementById('destSearch').value.toLowerCase();
      const filtered = destinationsList.filter(d => {
        const matchQuery = d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q);
        const matchCat = currentCategory === 'all' || d.region === currentCategory;
        return matchQuery && matchCat;
      });

      const grid = document.getElementById('destGrid');
      grid.innerHTML = filtered.map(d => `
        <div class="bg-white rounded-2xl overflow-hidden shadow-md border border-gray-100 hover:shadow-xl transition-all cursor-pointer" onclick="location.href='packages.html?dest=${encodeURIComponent(d.name)}'">
          <div class="relative h-56">
            <img src="${d.img}" alt="${d.name}" class="w-full h-full object-cover" />
            <span class="absolute top-4 left-4 bg-[#004E89] text-white text-xs font-bold px-3 py-1 rounded-full">
              ${d.region}
            </span>
          </div>
          <div class="p-6">
            <div class="flex justify-between items-center mb-2">
              <h3 class="text-xl font-bold text-[#2D3142]">${d.name}</h3>
              <span class="text-xs font-semibold text-[#FF6B35]">${d.packages} Packages</span>
            </div>
            <p class="text-xs text-gray-500 mb-4 leading-relaxed">${d.desc}</p>
            <span class="text-xs font-bold text-[#FF6B35] hover:underline flex items-center gap-1">
              Explore Packages &rarr;
            </span>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', filterDestinations);
  </script>
</body>

</html>
