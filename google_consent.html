<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: white; border-radius: 28px; padding: 36px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
  </style>
</head>
<body>
  <div class="card text-center">
    <svg class="w-12 h-12 mx-auto mb-4" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
    </svg>
    <h1 class="text-2xl font-normal text-gray-900 mb-2">Choose an account</h1>
    <p class="text-gray-600 mb-8">to continue to Wayfare</p>

    <div class="border border-gray-300 rounded-xl overflow-hidden text-left mb-6">
      <div onclick="loginGoogle('john@example.com', 'John Doe')" class="flex items-center p-3 hover:bg-gray-50 border-b border-gray-300 transition-colors cursor-pointer">
        <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-medium text-lg mr-4">J</div>
        <div class="flex-1">
          <div class="text-sm font-medium text-gray-800">John Doe</div>
          <div class="text-xs text-gray-500">john@example.com</div>
        </div>
      </div>
      <div onclick="promptEmail()" class="flex items-center p-3 hover:bg-gray-50 transition-colors cursor-pointer text-sm font-medium text-gray-700">
        <svg class="w-5 h-5 mr-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        Use another account
      </div>
    </div>

    <div class="text-sm text-gray-500 text-left">
      To continue, Google will share your name, email address, and language preference with Wayfare.
    </div>
  </div>

  <script src="static/js/app-state.js"></script>
  <script>
    function loginGoogle(email, name) {
      WayfareState.setCurrentUser({
        name: name,
        email: email,
        role: email.includes('admin') ? 'admin' : 'user'
      });
      window.location.href = email.includes('admin') ? 'admin.html' : 'dashboard.html';
    }

    function promptEmail() {
      const email = prompt('Enter your Google email:');
      if (email) {
        const name = email.split('@')[0];
        loginGoogle(email, name.charAt(0).toUpperCase() + name.slice(1));
      }
    }
  </script>
</body>
</html>
